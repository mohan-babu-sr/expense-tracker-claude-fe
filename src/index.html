<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <title>Expense Tracker</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Status bar = top toolbar color (--mat-sys-surface-container). HTML can't read CSS variables, so the values
         are repeated here (R16 AC3, design §11.2). Must stay ABOVE the script below, which adjusts them. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#efedf0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1f2022" />
    <!-- R11 AC3: apply the saved theme BEFORE Angular starts, so a dark-theme user never sees a white flash.
         R16 AC3: an explicit Light/Dark also sets both status-bar colors to that theme's color (each meta keeps its
         own color in data-own, so SettingsService can restore it for System).
         Key must match SETTINGS_STORAGE_KEY in core/services/settings.service.ts. -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('expense-tracker.settings') || '{}').theme;
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
          var ms = document.querySelectorAll('meta[name="theme-color"]'), c, i;
          for (i = 0; i < ms.length; i++) if (ms[i].media.indexOf(t) >= 0) c = ms[i].content;
          for (i = 0; i < ms.length; i++) { ms[i].setAttribute('data-own', ms[i].content); if (c) ms[i].content = c; }
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="32x32" />
    <!-- R16 (design §11.2): installable app. iOS ignores the manifest icons/name, hence the apple-* tags. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Expenses" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
