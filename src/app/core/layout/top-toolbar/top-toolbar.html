<mat-toolbar class="toolbar">
  <!-- v5.1 (R10, design §13.8): ☰ opens the drawer with every page (Budgets, Categories, Settings…).
       Plain <button>: keeps MatButton out of CoreModule (main bundle). -->
  <button
    type="button"
    class="toolbar__action toolbar__menu"
    (click)="menu.emit()"
    [attr.aria-label]="pendingCount() ? 'Open menu (' + pendingCount() + ' waiting for approval)' : 'Open menu'"
  >
    <!-- Badge = join requests waiting (R13 AC7) — moved here from the old settings gear -->
    <mat-icon
      aria-hidden="true"
      [matBadge]="pendingCount()"
      [matBadgeHidden]="!pendingCount()"
      matBadgeSize="small"
      matBadgeColor="warn"
      >menu</mat-icon
    >
  </button>
  <span class="toolbar__title">{{ title() }}</span>
  <span class="toolbar__icon" aria-hidden="true"><mat-icon>account_balance_wallet</mat-icon></span>
</mat-toolbar>
