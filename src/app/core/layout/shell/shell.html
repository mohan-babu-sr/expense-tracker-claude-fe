<!-- Global loading indicator for API calls (NFR2) -->
@if (isLoading()) {
  <mat-progress-bar class="global-progress" mode="indeterminate" aria-label="Loading" />
}

<mat-sidenav-container class="shell" [class.shell--mobile]="isMobile()">
  <!-- Laptop: always-open side nav. Phone (v5.1): the SAME list as a slide-in drawer opened by the toolbar ☰
       (mode "over" = overlay with backdrop, focus trap and Esc to close). Bare pages: none. -->
  <mat-sidenav
    class="shell__sidenav"
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!bare() && (isMobile() ? drawerOpen() : true)"
    (openedChange)="drawerOpen.set($event)"
    [disableClose]="!isMobile()"
    [autoFocus]="isMobile() ? 'first-tabbable' : false"
  >
    @if (!bare()) {
      <app-side-nav (click)="onDrawerClick($event)" />
    }
  </mat-sidenav>

  <mat-sidenav-content class="shell__body">
    @if (isMobile() && !bare()) {
      <app-top-toolbar (menu)="drawerOpen.set(true)" />
    }

    <main class="shell__content" [class.shell__content--bare]="bare()">
      <router-outlet />
    </main>

    @if (isMobile() && !bare()) {
      <app-bottom-nav />
    }
  </mat-sidenav-content>
</mat-sidenav-container>
