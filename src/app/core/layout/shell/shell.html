<!-- Global loading indicator for API calls (NFR2) -->
@if (isLoading()) {
  <mat-progress-bar class="global-progress" mode="indeterminate" aria-label="Loading" />
}

<mat-sidenav-container class="shell" [class.shell--mobile]="isMobile()">
  <!-- Laptop navigation. On mobile, and on bare pages, it stays closed. -->
  <mat-sidenav class="shell__sidenav" mode="side" [opened]="!isMobile() && !bare()" [disableClose]="true">
    @if (!isMobile() && !bare()) {
      <app-side-nav />
    }
  </mat-sidenav>

  <mat-sidenav-content class="shell__body">
    @if (isMobile() && !bare()) {
      <app-top-toolbar />
    }

    <main class="shell__content" [class.shell__content--bare]="bare()">
      <router-outlet />
    </main>

    @if (isMobile() && !bare()) {
      <app-bottom-nav />
    }
  </mat-sidenav-content>
</mat-sidenav-container>
