<div class="table-card">
  <!-- Scroll container: if columns ever don't fit, the TABLE scrolls sideways, never the page (R10 AC4).
       tabindex + role + label make the scroll area keyboard-reachable and announced. -->
  <div class="table-scroll" tabindex="0" role="region" aria-label="Expenses table">
    <table mat-table [dataSource]="expenses()" class="expense-table" aria-label="Expenses">
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let e" class="nowrap">{{ e.date | date: 'd MMM y' }}</td>
      </ng-container>

      <ng-container matColumnDef="user">
        <th mat-header-cell *matHeaderCellDef>User</th>
        <td mat-cell *matCellDef="let e" class="nowrap">{{ e.user }}</td>
      </ng-container>

      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>Category</th>
        <td mat-cell *matCellDef="let e"><app-category-chip [category]="e.category" /></td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Merchant / Note</th>
        <td mat-cell *matCellDef="let e" class="description">
          <span class="description__merchant">{{ e.merchant || '—' }}</span>
          @if (e.note) {
            <span class="description__note">{{ e.note }}</span>
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="paymentMethod">
        <th mat-header-cell *matHeaderCellDef>Payment</th>
        <td mat-cell *matCellDef="let e" class="nowrap">{{ (e.paymentMethod | paymentMethodLabel) || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef class="amount">Amount</th>
        <td mat-cell *matCellDef="let e" class="amount">{{ e.amount | inrCurrency }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef><span class="cdk-visually-hidden">Actions</span></th>
        <td mat-cell *matCellDef="let e" class="actions">
          <button mat-icon-button type="button" (click)="edit.emit(e)" [attr.aria-label]="'Edit ' + (e.merchant || e.note || 'expense')" matTooltip="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" (click)="delete.emit(e)" [attr.aria-label]="'Delete ' + (e.merchant || e.note || 'expense')" matTooltip="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </div>

  <mat-paginator
    [length]="total()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="pageSizeOptions"
    (page)="page.emit($event)"
    showFirstLastButtons
    aria-label="Select page of expenses"
  />
</div>
