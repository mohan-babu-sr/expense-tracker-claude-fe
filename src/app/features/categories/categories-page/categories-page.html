<app-page-header title="Categories" [subtitle]="subtitle()">
  <button mat-flat-button type="button" (click)="openDialog()">
    <mat-icon>add</mat-icon>
    Add category
  </button>
</app-page-header>

@if (loaded()) {
  @if (categories().length) {
    <!-- v6 (R25 AC2, design §14.4): phone = one card per row, laptop = auto-fill grid of cards -->
    <ul class="category-grid" aria-label="Categories">
      @for (category of categories(); track category.id) {
        <li class="category-card" [style.--category-color]="category.color">
          <button
            type="button"
            class="category-card__main"
            (click)="openDialog(category)"
            [attr.aria-label]="'Edit ' + category.name"
          >
            <span class="category-card__avatar" aria-hidden="true"><mat-icon [fontIcon]="category.icon" /></span>
            <span class="category-card__text">
              <span class="category-card__name">{{ category.name }}</span>
              <span class="category-card__meta">
                {{ category.expenseCount ?? 0 }} {{ category.expenseCount === 1 ? 'expense' : 'expenses' }}
                @if (category.isSystem) {
                  <span class="category-card__badge"><mat-icon aria-hidden="true">lock</mat-icon> System</span>
                }
              </span>
            </span>
          </button>

          <button mat-icon-button type="button" [matMenuTriggerFor]="menu" [attr.aria-label]="'More actions for ' + category.name">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu" xPosition="before">
            <button mat-menu-item (click)="openDialog(category)">
              <mat-icon>edit</mat-icon>
              <span>Edit</span>
            </button>
            <!-- Other is the fallback category: disabled + the reason in words (R5 AC4, NFR5) -->
            <button mat-menu-item (click)="confirmDelete(category)" [disabled]="category.isSystem">
              <mat-icon>delete</mat-icon>
              <span>{{ category.isSystem ? 'Can’t delete (fallback)' : 'Delete' }}</span>
            </button>
          </mat-menu>
        </li>
      }
    </ul>
  } @else {
    <app-empty-state
      icon="category"
      title="No categories"
      message="Start the server once to create the default categories, or add your own."
      actionLabel="Add category"
      (action)="openDialog()"
    />
  }
}
