<form [formGroup]="form" (ngSubmit)="save()" novalidate>
  <h2 mat-dialog-title>{{ data.entry.name }} · {{ data.monthLabel }}</h2>

  <mat-dialog-content class="entry-form">
    <mat-form-field appearance="outline" floatLabel="always">
      <mat-label>Amount this month</mat-label>
      <span matTextPrefix>₹&nbsp;</span>
      <input matInput type="number" inputmode="decimal" min="0.01" step="0.01" formControlName="amount" autocomplete="off" />
      <mat-hint>Only {{ data.monthLabel }} changes — other months keep the usual amount</mat-hint>
      @if (form.controls.amount.invalid) {
        <mat-error>{{ amountError() }}</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancel</button>
    <button mat-flat-button type="submit" [disabled]="form.invalid || busy()">
      {{ busy() ? 'Saving…' : 'Save' }}
    </button>
  </mat-dialog-actions>
</form>
