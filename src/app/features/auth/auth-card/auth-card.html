<header class="auth-card__header">
  <!-- v5 brand header (R21 AC8): the icon in a raised indigo tile with a soft glow behind it -->
  <span class="auth-card__logo" aria-hidden="true"><mat-icon>{{ icon() }}</mat-icon></span>
  <h1 class="auth-card__title">{{ title() }}</h1>
  @if (subtitle()) {
    <p class="auth-card__subtitle">{{ subtitle() }}</p>
  }
</header>

<section class="auth-card__body">
  <ng-content />
</section>

<footer class="auth-card__footer">
  <ng-content select="[authFooter]" />
</footer>
