<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="pin-head" mat-dialog-title>
    <span class="pin-head__icon" aria-hidden="true"><mat-icon>lock</mat-icon></span>
    <span>{{ data.title }}</span>
  </div>

  <mat-dialog-content class="pin-form">
    <p class="pin-form__message">{{ message() }}</p>

    <!-- v7 (R27): fingerprint / Face ID, only with a registered device on a supporting browser -->
    @if (passkeyAvailable()) {
      @if (passkeyError(); as err) {
        <p class="pin-form__error" role="alert"><mat-icon aria-hidden="true">error</mat-icon> {{ err }}</p>
      }
      <button matButton="tonal" type="button" class="pin-form__passkey" [disabled]="passkeyBusy()" (click)="usePasskey()">
        <mat-icon>fingerprint</mat-icon>
        {{ passkeyBusy() ? 'Waiting for your device…' : 'Use fingerprint / Face ID' }}
      </button>
      <p class="pin-form__divider"><span>or enter your PIN</span></p>
    }

    <mat-form-field appearance="outline">
      <mat-label>Your PIN</mat-label>
      <input
        matInput
        type="password"
        inputmode="numeric"
        autocomplete="current-password"
        formControlName="pin"
        maxlength="6"
      />
      @if (form.controls.pin.invalid) {
        <mat-error>{{ pinError() }}</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancel</button>
    <button mat-flat-button type="submit" [disabled]="busy()">
      {{ busy() ? 'Checking…' : data.confirmText }}
    </button>
  </mat-dialog-actions>
</form>
